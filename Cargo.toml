[package]
name = "signal-ethos-zero"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/signal-ethos-zero"
description = "Generation-zero ordinary Signal contract for Ethos."
publish = false

[lib]
name = "signal_ethos_zero"
path = "src/lib.rs"

[dependencies]
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"
